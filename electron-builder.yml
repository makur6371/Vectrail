appId: com.makur.vectrail
productName: Vectrail
copyright: Copyright (c) 2026 Makur (MIT)
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
extraResources:
  - from: build/Base.mp4
    to: Base.mp4
  - from: build/icon.png
    to: icon.png
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
portable:
  artifactName: Vectrail-Windows-Portable-${version}-${arch}.exe
fileAssociations:
  - ext: vectrail
    name: Vectrail Project
    description: Vectrail Video Project
    role: Editor
